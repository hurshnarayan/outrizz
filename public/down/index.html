<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quick Download — Harsh's Files</title>
  <style>
    :root {
      --bg: #09090b;
      --card: #18181b;
      --card-hover: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #ef4444;
      --accent-hover: #dc2626;
      --border: #27272a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .header {
      margin-bottom: 1.5rem;
      text-align: center;
    }
    .header h1 {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.35rem;
    }
    .header p {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .actions-top {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }
    .btn-all {
      flex: 1;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 0.875rem;
      border: none;
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      transition: background 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    .btn-all:hover {
      background: var(--accent-hover);
    }
    .btn-folder {
      background: var(--card-hover);
      color: var(--text);
      font-weight: 500;
      font-size: 0.875rem;
      border: 1px solid var(--border);
      padding: 0.65rem 1rem;
      border-radius: 0.5rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-folder:hover {
      background: #3f3f46;
    }
    .file-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }
    .file-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 0.85rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      text-decoration: none;
      color: inherit;
      transition: all 0.15s ease;
    }
    .file-item:hover {
      background: var(--card-hover);
      border-color: #3f3f46;
      transform: translateY(-1px);
    }
    .file-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      overflow: hidden;
    }
    .file-icon {
      background: rgba(239, 68, 68, 0.15);
      color: var(--accent);
      width: 34px;
      height: 34px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.65rem;
      flex-shrink: 0;
    }
    .file-details {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .file-name {
      font-size: 0.875rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-size {
      font-size: 0.75rem;
      color: var(--text-muted);
    }
    .download-badge {
      background: var(--card-hover);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.65rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      flex-shrink: 0;
    }
    .file-item:hover .download-badge {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .footer-note {
      text-align: center;
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Direct File Downloads</h1>
      <p>Click any file to immediately download it</p>
    </div>

    <div class="actions-top">
      <button class="btn-all" onclick="downloadAll()">⬇ Download All (6)</button>
      <a class="btn-folder" href="https://drive.google.com/drive/folders/1y5OMIPYoiIb1e__MYot5pOko5c17kNPe?usp=sharing" target="_blank" rel="noopener">Drive Folder ↗</a>
    </div>

    <div class="file-list" id="fileList">
      <!-- Populated via JavaScript -->
    </div>

    <div class="footer-note">
      outrizz.lol/down
    </div>
  </div>

  <script>
    const files = [
      { id: '1Bz2pEAaWsZ9fiTvaJfGNfNZ4onlFKq3H', name: 'HARSH SOLIDS.pdf', size: '181 KB', key: 'solids' },
      { id: '1jWJ3OVIsWggfmKACB-ZiNFeJE3OXskMJ', name: 'LINES_QUES1_HARSH.pdf', size: '167 KB', key: 'lines1' },
      { id: '10nOC-VDNa5Bj4uH0a3q5DbfqRV6yHAH7', name: 'LINES_QUES7_HARSH.pdf', size: '117 KB', key: 'lines7' },
      { id: '1RPhazCOeCs_CZpjfNpHfqcHwS9AdC9MB', name: 'PLAINS_RECTANGLE_HARSH.pdf', size: '75 KB', key: 'plains' },
      { id: '11ybdvf6NyksULUbUiYd7s6q3Y2nGFVLs', name: 'POINTS_QUES_1_HARSH.pdf', size: '41 KB', key: 'points1' },
      { id: '1aKzC1bzszoAKKgoeVrrprNJ92ak4EPii', name: 'POINTS_QUES3_HARSH.pdf', size: '111 KB', key: 'points3' }
    ];

    function getDownloadUrl(id) {
      return `https://drive.usercontent.google.com/download?id=${id}&export=download`;
    }

    const listEl = document.getElementById('fileList');
    files.forEach((f) => {
      const a = document.createElement('a');
      a.className = 'file-item';
      a.href = getDownloadUrl(f.id);
      a.innerHTML = `
        <div class="file-info">
          <div class="file-icon">PDF</div>
          <div class="file-details">
            <span class="file-name">${f.name}</span>
            <span class="file-size">${f.size}</span>
          </div>
        </div>
        <span class="download-badge">Download</span>
      `;
      listEl.appendChild(a);
    });

    function downloadAll() {
      files.forEach((f, i) => {
        setTimeout(() => {
          const tempLink = document.createElement('a');
          tempLink.href = getDownloadUrl(f.id);
          tempLink.setAttribute('download', f.name);
          document.body.appendChild(tempLink);
          tempLink.click();
          tempLink.remove();
        }, i * 400);
      });
    }

    // Direct auto-download support via query param: e.g. /down?f=1 or /down?f=solids
    const params = new URLSearchParams(window.location.search);
    const fParam = params.get('f') || params.get('file');
    if (fParam) {
      const idx = parseInt(fParam, 10);
      let match = null;
      if (!isNaN(idx) && idx >= 1 && idx <= files.length) {
        match = files[idx - 1];
      } else {
        match = files.find(f => f.key === fParam.toLowerCase() || f.name.toLowerCase().includes(fParam.toLowerCase()));
      }
      if (match) {
        window.location.href = getDownloadUrl(match.id);
      }
    }
  </script>
</body>
</html>
